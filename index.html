<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workjammers 4D - SaaS Hyper-Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #05080a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sidebar {
            background-color: rgba(13, 17, 23, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .header-glass {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        #canvas-container { width: 100%; height: 100%; cursor: move; }
        .kpi-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.2;
        }
        .ui-overlay { pointer-events: none; }
        .ui-overlay * { pointer-events: auto; }
        .scoreboard-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #334155;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            padding: 4px 24px;
            border-radius: 0 0 12px 12px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .zone-card-input {
            background: transparent;
            border: none;
            outline: none;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            font-size: 0.7rem;
            text-align: center;
            width: 110px;
            cursor: text;
            transition: all 0.2s;
        }
        .zone-card-input:focus { background: rgba(255, 255, 255, 0.1); letter-spacing: 0.05em; }
    </style>
</head>
<body class="flex flex-col h-screen">
    <div class="scanline"></div>
    <header class="header-glass flex items-center justify-between px-6 py-3 z-50">
        <div class="flex items-center gap-6">
            <div class="flex flex-col">
                <span class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Dimension Link</span>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></div>
                    <span class="text-white text-sm font-bold mono uppercase tracking-tighter">Hyper-D // Active</span>
                </div>
            </div>
        </div>
        <div class="text-center">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">
                <span class="text-blue-500">Work</span><span class="text-cyan-300">jammers</span>
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="kpi-badge">
                <span id="time-display" class="text-sm font-bold mono text-cyan-400">05:00:00</span>
            </div>
        </div>
    </header>
    <div class="flex flex-1 overflow-hidden relative">
        <aside class="sidebar w-[200px] lg:w-[320px] flex flex-col p-6 gap-6 z-40">
            <button id="reset-btn" onclick="resetSimulation()" class="mt-auto bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl text-[11px] uppercase tracking-[0.2em] transition-all shadow-xl shadow-blue-900/30 active:scale-[0.98] border border-blue-400/20">
                Iniciar Fluxo
            </button>
        </aside>
        <main class="flex-1 relative">
            <div id="canvas-container"></div>
            <div class="absolute inset-0 ui-overlay flex flex-col p-0">
                <div class="flex justify-between items-start w-full p-4">
                    <div class="bg-yellow-400 p-2 border-2 border-black shadow-[4px_4px_0_rgba(0,0,0,1)] flex flex-col items-center">
                        <span class="text-[7px] text-black/60 font-bold uppercase mb-0.5 tracking-tighter">PLAYER 1</span>
                        <input type="text" value="PLAYER 1" onfocus="if(this.value==='PLAYER 1') this.value=''" onblur="if(this.value==='') this.value='PLAYER 1'" class="zone-card-input text-black placeholder-black/50" />
                    </div>
                    <div class="scoreboard-container">
                        <div class="text-center">
                            <span id="score-a" class="text-3xl font-black mono text-yellow-400">00</span>
                        </div>
                        <div class="text-cyan-500 font-black italic text-sm">VS</div>
                        <div class="text-center">
                            <span id="score-b" class="text-3xl font-black mono text-red-500">00</span>
                        </div>
                    </div>
                    <div class="bg-red-600 p-2 border-2 border-white shadow-[4px_4px_0_rgba(0,0,0,1)] flex flex-col items-center">
                        <span class="text-[7px] text-white/60 font-bold uppercase mb-0.5 tracking-tighter">PLAYER 2</span>
                        <input type="text" value="PLAYER 2" onfocus="if(this.value==='PLAYER 2') this.value=''" onblur="if(this.value==='') this.value='PLAYER 2'" class="zone-card-input text-white placeholder-white/50" />
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        let scene, camera, renderer, arena, disc, players = [];
        let particles = [];
        let isMouseDown = false;
        let scoreA = 0;
        let scoreB = 0;
        let velocity = new THREE.Vector3(0, 0, 0);
        const arenaX = 20;
        const arenaZ = 12.5;
        const discRadius = 1.2;
        let duration = 5 * 60 * 1000;
        let startTime = null;
        let isTimerRunning = false;

        function updateScoreboard() {
            document.getElementById('score-a').innerText = scoreA.toString().padStart(2, '0');
            document.getElementById('score-b').innerText = scoreB.toString().padStart(2, '0');
        }

        function launchDisc() {
            const angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
            const dir = Math.random() > 0.5 ? 1 : -1;
            velocity.set(dir * 0.35, 0, Math.sin(angle) * 0.2);
            disc.position.set(0, 2, 0);
        }

        function resetSimulation() {
            startTime = Date.now();
            isTimerRunning = true;
            scoreA = 0;
            scoreB = 0;
            updateScoreboard();
            document.getElementById('reset-btn').innerText = "Reiniciar Fluxo";
            launchDisc();
        }

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 18, 28);
            camera.lookAt(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0x404040, 2));
            const pointLight = new THREE.PointLight(0x00f2ff, 1.5, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);
            arena = new THREE.Mesh(
                new THREE.BoxGeometry(40, 1, 25),
                new THREE.MeshPhongMaterial({ color: 0x1a2230, emissive: 0x050a10, specular: 0x555555, shininess: 30 })
            );
            scene.add(arena);
            const gridHelper = new THREE.GridHelper(40, 20, 0x00f2ff, 0x222222);
            gridHelper.position.y = 0.51;
            scene.add(gridHelper);
            disc = new THREE.Mesh(
                new THREE.CylinderGeometry(discRadius, discRadius, 0.5, 32),
                new THREE.MeshPhongMaterial({ color: 0xff8c00, emissive: 0xff3300, emissiveIntensity: 0.5 })
            );
            disc.position.y = 2;
            scene.add(disc);
            for(let i = 0; i < 30; i++) {
                const p = new THREE.Mesh(
                    new THREE.SphereGeometry(0.15, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.6 })
                );
                p.visible = false;
                scene.add(p);
                particles.push(p);
            }
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, 6), new THREE.MeshPhongMaterial({ color: 0x00f2ff, emissive: 0x004466 }));
            p1.position.set(-18.5, 2.5, 0);
            scene.add(p1);
            players.push(p1);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 4, 6), new THREE.MeshPhongMaterial({ color: 0xff007a, emissive: 0x660033 }));
            p2.position.set(18.5, 2.5, 0);
            scene.add(p2);
            players.push(p2);
            container.addEventListener('mousedown', () => isMouseDown = true);
            container.addEventListener('mouseup', () => isMouseDown = false);
            container.addEventListener('mousemove', (e) => {
                if(isMouseDown) {
                    camera.position.x += e.movementX * 0.05;
                    camera.position.y -= e.movementY * 0.05;
                    camera.position.y = Math.max(5, camera.position.y);
                    camera.lookAt(0, 0, 0);
                }
            });
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        let trailHistory = [];

        function animate() {
            requestAnimationFrame(animate);
            let remaining = duration;
            if (isTimerRunning && startTime) {
                const elapsed = Date.now() - startTime;
                remaining = Math.max(0, duration - elapsed);
                if (remaining > 0) {
                    disc.position.add(velocity);
                    disc.rotation.y += 0.1;
                    if (Math.abs(disc.position.z) > arenaZ - discRadius) {
                        velocity.z *= -1;
                        disc.position.z = Math.sign(disc.position.z) * (arenaZ - discRadius);
                    }
                    if (disc.position.x > arenaX + 2) {
                        scoreA++;
                        updateScoreboard();
                        launchDisc();
                    } else if (disc.position.x < -arenaX - 2) {
                        scoreB++;
                        updateScoreboard();
                        launchDisc();
                    }
                    if (disc.position.x < -17 && Math.abs(disc.position.z - players[0].position.z) < 3.5) {
                        if (velocity.x < 0) {
                            velocity.x *= -1.05;
                            velocity.z += (disc.position.z - players[0].position.z) * 0.05;
                        }
                    }
                    if (disc.position.x > 17 && Math.abs(disc.position.z - players[1].position.z) < 3.5) {
                        if (velocity.x > 0) {
                            velocity.x *= -1.05;
                            velocity.z += (disc.position.z - players[1].position.z) * 0.05;
                        }
                    }
                    const speed = velocity.length();
                    if (speed > 1.2) velocity.multiplyScalar(0.98);
                }
            }
            const mins = Math.floor(remaining / 60000);
            const secs = Math.floor((remaining % 60000) / 1000);
            const ms = Math.floor((remaining % 1000) / 10);
            const timeDisplay = document.getElementById('time-display');
            if (timeDisplay) timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}:${ms.toString().padStart(2, '0')}`;
            players[0].position.z += (disc.position.z - players[0].position.z) * 0.12;
            players[1].position.z += (disc.position.z - players[1].position.z) * 0.12;
            players.forEach(p => p.position.z = Math.max(-9.5, Math.min(9.5, p.position.z)));
            if (isTimerRunning) {
                trailHistory.unshift(disc.position.clone());
                if (trailHistory.length > particles.length) trailHistory.pop();
                particles.forEach((p, i) => {
                    if (trailHistory[i]) {
                        p.position.copy(trailHistory[i]);
                        p.visible = true;
                        p.scale.setScalar(1 - (i / particles.length));
                    }
                });
            }
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
